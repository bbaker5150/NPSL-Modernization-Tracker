<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#07111f" />
    <title>Modernization Project Tracker</title>
    <script>
      window.MOD_TRACKER_CONFIG = window.MOD_TRACKER_CONFIG || {};
      try {
        document.documentElement.dataset.theme = localStorage.getItem('mod-tracker-theme') === 'light' ? 'light' : 'dark';
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
