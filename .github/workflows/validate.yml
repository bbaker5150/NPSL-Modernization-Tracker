name: Validate modernization tracker
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies (same gate as main)
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:singlefile
      - run: npm run verify:singlefile
      - name: Install smoke-test browser
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm run smoke:singlefile
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tracker-ui-review
          path: test-artifacts
          if-no-files-found: ignore
