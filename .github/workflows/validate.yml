name: Validate modernization tracker
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit dependencies (same gate as main)
        run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build:singlefile
      - run: npm run verify:singlefile
      - name: Install smoke-test browser
        timeout-minutes: 5
        run: |
          # Avoid the hosted runner's Azure HTTP mirror, which can stall apt.
          # Keep browser dependencies and smoke tests required.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            printf '%s\n' 'https://archive.ubuntu.com/ubuntu/' | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
          fi
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - run: npm run smoke:singlefile
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: tracker-ui-review
          path: test-artifacts
          if-no-files-found: ignore
